<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--bg:#080808;--off:#e8e4dc}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:"Montserrat",sans-serif}

/* ── PAGE LAYOUT ── */
#page{display:flex;height:100vh;height:100dvh}

/* Desktop: split screen */
#bio{
  width:360px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;gap:20px;
  background:var(--bg);border-right:0.5px solid rgba(255,255,255,0.06);
  overflow:hidden;
}
#chat-wrap{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:#0a0a0a;
}

/* ── BIO SECTION ── */
#bio-fotos{display:flex;gap:3px;width:100%;align-items:flex-end}
#bio-rosto{
  height:9vh;width:auto;object-fit:cover;object-position:center top;
  border-radius:5px;border:1.5px solid rgba(201,168,76,0.4);
  cursor:pointer;transition:opacity .2s;flex-shrink:0;
}
#bio-rosto:hover{opacity:.85}
#bio-thumbs{display:flex;gap:3px;flex:1}
#bio-thumbs img{
  flex:1;height:7vh;object-fit:cover;border-radius:4px;
  border:0.5px solid rgba(255,255,255,0.06);
  cursor:pointer;transition:opacity .2s;
}
#bio-thumbs img:hover{opacity:.85;border-color:rgba(201,168,76,0.4)}
#bio-text{text-align:center;width:100%}
#bio-eyebrow{
  font-size:7px;font-weight:500;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);margin-bottom:3px;
}
#bio-headline{
  font-family:"Cormorant Garamond",serif;font-size:13px;font-weight:300;
  color:var(--off);line-height:1.3;
}
/* ── LIGHTBOX ── */
#lb{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center}
#lb.open{display:flex}
#lb img{max-width:50vw;max-height:80vh;object-fit:contain;border-radius:8px}
#lb-close{position:absolute;top:16px;right:20px;width:38px;height:38px;border:0.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:18px;border-radius:4px}
@media(max-width:767px){#lb img{max-width:90vw;max-height:70vh}}

/* ── CHAT EMBEDDED ── */
#aura-chat{
  display:flex;flex-direction:column;flex:1;overflow:hidden;
  border-radius:0;border:none;box-shadow:none;
  background:#111;
}
#aura-hdr{
  background:#0d0d0d;border-bottom:1px solid #1c1c1c;
  padding:13px 15px;display:flex;align-items:center;gap:10px;flex-shrink:0;
}
#aura-av{
  width:34px;height:34px;border-radius:50%;
  background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.28);
  display:flex;align-items:center;justify-content:center;color:#C9A84C;font-size:14px;flex-shrink:0;
}
#aura-name{font-family:"Cormorant Garamond",Georgia,serif;font-size:15px;font-weight:700;color:#e5d09a;letter-spacing:.3px}
#aura-sub{font-size:10px;color:#484848;margin-top:1px;font-family:sans-serif}
#aura-msgs{
  flex:1;overflow-y:auto;padding:14px;
  display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth;
}
#aura-msgs::-webkit-scrollbar{width:3px}
#aura-msgs::-webkit-scrollbar-track{background:transparent}
#aura-msgs::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
.am{max-width:86%;font-size:13px;line-height:1.6;border-radius:12px;padding:9px 13px;font-family:'DM Sans','Segoe UI',sans-serif;animation:amIn .25s ease}
.am.b{background:#191919;border:1px solid #202020;color:#bbb;align-self:flex-start;border-bottom-left-radius:4px;white-space:pre-line}
.am.u{background:rgba(201,168,76,.13);border:1px solid rgba(201,168,76,.22);color:#e5d09a;align-self:flex-end;border-bottom-right-radius:4px}
.am img{max-width:120px;max-height:120px;border-radius:8px;display:block;margin-top:6px}
@keyframes amIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.aura-dots{display:flex;gap:4px;padding:9px 14px;align-self:flex-start}
.aura-dots span{width:6px;height:6px;background:#333;border-radius:50%;animation:adot 1.2s infinite}
.aura-dots span:nth-child(2){animation-delay:.2s}.aura-dots span:nth-child(3){animation-delay:.4s}
@keyframes adot{0%,80%,100%{opacity:.2}40%{opacity:1}}
#aura-inp-area{
  border-top:1px solid #1c1c1c;padding:10px 12px;
  display:flex;gap:7px;align-items:flex-end;
  background:#0d0d0d;flex-shrink:0;
  padding-bottom:max(10px,env(safe-area-inset-bottom,10px));
}
#aura-inp{
  flex:1;background:#181818;border:1px solid #252525;border-radius:10px;
  padding:9px 11px;font-family:'DM Sans','Segoe UI',sans-serif;font-size:16px;
  color:#ccc;resize:none;outline:none;transition:border-color .2s;max-height:78px;overflow-y:auto;
}
#aura-inp:focus{border-color:rgba(201,168,76,.35)}
#aura-inp::placeholder{color:#383838}
#aura-send{
  background:#C9A84C;border:none;border-radius:10px;width:38px;height:38px;
  color:#0f0f0f;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:background .2s;flex-shrink:0;
}
#aura-send:hover{background:#d9b84e}
#aura-send:disabled{background:#1e1e1e;color:#333;cursor:not-allowed}
#aura-photo-btn{
  background:#181818;border:1px solid #252525;border-radius:10px;
  width:38px;height:38px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:#444;font-size:16px;transition:all .2s;flex-shrink:0;
}
#aura-photo-btn:hover{border-color:#333;color:#666}
.ask{display:inline-block;margin-top:7px;padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid #2a2a2a;background:#161616;color:#777;transition:all .2s;font-family:'DM Sans',sans-serif}
.ask:hover{background:#1e1e1e;color:#999}
#aura-ph-inp{display:none}

/* ── FLUXO GUIADO — botões ── */
.flow-btns{display:flex;flex-wrap:wrap;gap:7px;align-self:flex-start;max-width:92%;padding:2px 0 4px 0}
.flow-btn{background:#181818;border:1px solid rgba(201,168,76,0.35);color:#C9A84C;border-radius:20px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:'DM Sans','Segoe UI',sans-serif;transition:all .15s;white-space:nowrap}
.flow-btn:hover{background:rgba(201,168,76,0.1);border-color:#C9A84C}

/* ── MOBILE ── */
@media(max-width:767px){
  #page{flex-direction:column}
  #bio{
    width:100%;flex-shrink:0;
    flex-direction:column;align-items:center;
    padding:8px 10px 6px;gap:6px;
    border-right:none;border-bottom:0.5px solid rgba(255,255,255,0.06);
  }
  #chat-wrap{flex:1;min-height:0}
}
</style>
</head>

<script>
(function(){
  var C={
    rk:'re_ceSfj4e2_NKrF8m2CHfaMtaj2S1pPLq15',

    eC:'camilla-acampos@hotmail.com',
    px:'https://inq-saas.vercel.app/api/resend',

  var origemUtm=(function(){try{return new URLSearchParams(window.location.search).get('origem')||'';}catch(e){return '';}}());
  var campanhasAtivas=[];

  // ── Config / campanha ─────────────────────────────────────────────────────
  function carregarConfig(){
    fetch('https://inq-saas.vercel.app/api/config').then(function(r){
      return r.ok?r.json():null;
    }).then(function(d){
      if(d&&d.studio_tel) studioTelAtual=d.studio_tel;
    }).catch(function(){});
  }

  function carregarCampanhas(){
    if(campanhasAtivas.length>0) return;
    fetch('https://inq-saas.vercel.app/api/campanhas-ativas').then(function(r){
      return r.ok?r.json():null;
    }).then(function(d){
      if(d&&Array.isArray(d.campanhas)) campanhasAtivas=d.campanhas;
    }).catch(function(){});
  }

  function montarMsgWA(ld){
    var ref='—';
    var obs=ld.obs||'';
    if(obs.indexOf('referência visual')!==-1) ref='Enviada no chat';
    else if(obs.indexOf('ideias')!==-1) ref='Tem ideias — descreveu no chat';
    else if(obs.indexOf('confia')!==-1) ref='Confia totalmente no artista';
    return [
      'Olá Abraão! Sou '+(ld.nome||'')+', acabei de solicitar um atendimento pela Aura da Casa dos Carvalho.',
      '',
      'Serviço: '+(ld.servico||'—'),

      'Orçamento: '+(ld.orcamento||'—'),
      'Referência: '+ref,
      'Melhor horário: '+(ld.horario_ligacao||'—'),
    ].join('\n');
  }

  // ── DOM refs ──────────────────────────────────────────────────────────────
  var msgs=document.getElementById('aura-msgs');

  var snd=document.getElementById('aura-send');
  var phBtn=document.getElementById('aura-photo-btn');
  var phInp=document.getElementById('aura-ph-inp');

  // ── UI helpers ────────────────────────────────────────────────────────────
  function botMsg(txt){
    var el=document.createElement('div');
    el.className='am b';
    el.textContent=txt;
    msgs.appendChild(el);
    scr();
    return el;
  }

  function usr(txt){
    var el=document.createElement('div');
    el.className='am u';
    el.textContent=txt;
    msgs.appendChild(el);scr();
  }

  function showDots(){
    var td=document.createElement('div');
    td.className='aura-dots';
    td.innerHTML='<span></span><span></span><span></span>';
    msgs.appendChild(td);scr();
    return td;
  }

  function botAnimado(txt,cb){
    var td=showDots();
    setTimeout(function(){
      td.remove();
      botMsg(txt);
      history.push({role:'assistant',content:txt});
      if(cb) cb();
    }, Math.min(500+txt.length*5,1600));
  }

  function renderBotoes(opcoes,onClique){
    var wrap=document.createElement('div');
    wrap.className='flow-btns';
    opcoes.forEach(function(op){
      var b=document.createElement('button');
      b.className='flow-btn';
      b.textContent=op;
      b.onclick=function(){
        wrap.remove();
        usr(op);
        onClique(op);
      };
      wrap.appendChild(b);
    });
    msgs.appendChild(wrap);
    scr();
    return wrap;
  }

  function scr(){msgs.scrollTop=msgs.scrollHeight;}
  function dis(v){inp.disabled=v;snd.disabled=v;inp.placeholder=inp.placeholder;}

  var WA_ICON_SVG='<svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="fill:#fff;flex-shrink:0"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.535 5.857L.057 23.571c-.073.272.172.517.444.444l5.792-1.463A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 0 1-5.012-1.374l-.36-.214-3.733.943.979-3.646-.235-.374A9.818 9.818 0 0 1 2.182 12C2.182 6.57 6.57 2.182 12 2.182c5.431 0 9.818 4.388 9.818 9.818 0 5.431-4.387 9.818-9.818 9.818z"/></svg>';

  function renderBot(txt){
    var el=document.createElement('div');
    el.className='am b';
    var html=txt.replace(/(https?:\/\/[^\s<\[]+)/g,function(url){
      return '<a href="'+url+'" target="_blank" rel="noopener" style="color:#C9A84C;word-break:break-all;">'+url+'</a>';
    });
    if(html.indexOf('[WA_LINK]')!==-1&&!waLinkOferecido){
      waLinkOferecido=true;
      var waHref='https://wa.me/55'+studioTelAtual+'?text='+encodeURIComponent(montarMsgWA(leadData));
      var waBtn='<a href="'+waHref+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:10px;margin-top:12px;padding:12px 20px;background:#25D366;color:#fff;border-radius:28px;text-decoration:none;font-weight:600;font-size:0.9em;box-shadow:0 2px 12px rgba(37,211,102,0.35);">'+WA_ICON_SVG+'Falar agora no WhatsApp — resposta rápida da nossa equipe</a>';
      html=html.replace('[WA_LINK]',waBtn);
    }else{
      html=html.replace(/\[WA_LINK\]/g,'');
    }
    html=html.replace(/\n/g,'<br>');
    el.innerHTML=html;
    msgs.appendChild(el);scr();
  }

  // ── Início ────────────────────────────────────────────────────────────────
  var GREETING='Olá! Sou a Aura, assistente da Casa dos Carvalho. 🖤\n\nVou registrar sua solicitação em menos de 1 minuto.\nAo final, você recebe um link direto para conversar pelo WhatsApp.\n\nPara começar, me passa seu nome e WhatsApp com DDD:';

  (function iniciar(){
    carregarCampanhas();
    carregarConfig();
    setTimeout(function(){
      botMsg(GREETING);
      history.push({role:'assistant',content:GREETING});
      inp.placeholder='ex: João Silva, 27 99999-0000';
      phBtn.style.display='none';
    },400);
  })();

  // ── FLUXO GUIADO ──────────────────────────────────────────────────────────

  function passo2(){
    fluxoEtapa=2;
    var fn=(leadData.nome||'').trim().split(' ')[0];
    botAnimado('Perfeito, '+fn+'! O que você está buscando?', function(){

        var servico=op.replace(/^[^\w]+/,'').toLowerCase();

        else { leadData.obs=(leadData.obs||'')+'Serviço: '+servico+'. '; passo4(); }

    dis(true);

  function passo3(){
    fluxoEtapa=3;
    botAnimado('Como está sua ideia?', function(){
      renderBotoes([
        '📸 Tenho referência',
        '💡 Tenho algumas ideias, mas nada concreto ainda',
        '🖤 Confio totalmente no artista'
      ], function(op){
        history.push({role:'user',content:op});
        if(op.indexOf('referência')!==-1){
          leadData.obs=(leadData.obs||'')+'Referência: tem referência visual. ';
          passo3A();
        } else if(op.indexOf('ideias')!==-1){
          leadData.obs=(leadData.obs||'')+'Referência: tem ideias, quer ajuda para criar a arte. ';
          passo3B();
        } else {
          leadData.obs=(leadData.obs||'')+'Referência: confia totalmente no artista. ';
          passo3C();
        }
        atualizarLead();
      });
      dis(false);
    });
    dis(true);
  }

  function passo3A(){
    fluxoEtapa='3a';
    botAnimado('Ótimo! Pode descrever o que você imagina e anexar sua referência em imagem.', function(){
      inp.placeholder='ex: quero algo no estilo blackwork, traços finos, inspirado em natureza...';
      phBtn.style.display='flex';
      pendingFile=null;
      fluxoEnviarOverride=function(){
        var txt=inp.value.trim();
        if(!txt&&!pendingFile) return;
        inp.value='';inp.style.height='auto';
        if(txt) usr(txt);
        var f=pendingFile; pendingFile=null;
        removePendingPreview();
        fluxoEnviarOverride=null;
        phBtn.style.display='none';
        enviarTextoEImagem(txt,f,function(){ passo4(); });
      };
      dis(false);
    });
    dis(true);
  }

  function passo3B(){
    fluxoEtapa='3b';
    botAnimado('Perfeito! Me conta o que você tem em mente — pode ser uma descrição, uma sensação, uma referência de outra área... qualquer detalhe ajuda na criação.', function(){
      inp.placeholder='ex: quero algo que remeta à liberdade, talvez com elementos geométricos ou da natureza...';
      phBtn.style.display='flex';
      pendingFile=null;
      fluxoEnviarOverride=function(){
        var txt=inp.value.trim();
        if(!txt&&!pendingFile) return;
        inp.value='';inp.style.height='auto';
        if(txt) usr(txt);
        var f=pendingFile; pendingFile=null;
        removePendingPreview();
        fluxoEnviarOverride=null;
        phBtn.style.display='none';
        enviarTextoEImagem(txt,f,function(){ passo4(); });
      };
      dis(false);
    });
    dis(true);
  }

  function passo3C(){
    fluxoEtapa='3c';
    botAnimado('Que confiança incrível! 🖤 O Abraão vai adorar criar algo único e especial para você.', function(){
      passo4();
    });
    dis(true);
  }

  async function enviarTextoEImagem(texto,file,cb){
    dis(true);
    if(file){
      try{
        var compressed=await compressImg(file,800,0.75);
        var r=await fetch(C.uploadUrl,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({base64:compressed.base64,mimeType:'image/jpeg',clienteId:savedLeadId||null})});

  // ── Parser local nome+tel (passo 0, sem API) ─────────────────────────────
  function parsePasso0(txt){
    var telMatch=txt.match(/(\d[\d\s\-\.]{7,13}\d)/);
    var tel=telMatch?telMatch[0].replace(/\D/g,''):'';
    var nome=txt.replace(telMatch?telMatch[0]:'','').replace(/[,;:\-]/g,' ').replace(/\s+/g,' ').trim();
    return {nome:nome,tel:tel};
  }

  // ── API — texto livre (etapa 99 e passos 3A/3B) ───────────────────────────
  async function askAura(userMsg){
    dis(true);
    if(userMsg!==null) history.push({role:'user',content:userMsg});
    var dots=showDots();
    try{
      var res=await fetch(C.apiUrl,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:history,campanhas:campanhasAtivas,contexto:C.contexto})
      });
      dots.remove();
      if(!res.ok) throw new Error('status '+res.status);
      var data=await res.json();
      var text=data.text||'Ops, tive um problema. Pode tentar novamente?';
      await new Promise(function(ok){ setTimeout(ok, Math.min(600+text.length*6,2000)); });
      renderBot(text);
      history.push({role:'assistant',content:text});
      processarRespostaAPI(data);
    }catch(e){
      dots.remove();
      renderBot('Desculpe, tive uma instabilidade. Pode tentar novamente?');
      console.warn('[Aura] chat error:',e);
    }
    dis(false);
    inp.focus();
  }

  function processarRespostaAPI(data){
    if(data.lead){
      var ld=data.lead;
      if(ld.nome && ld.tel){
        var ldKey=ld.nome+'|'+ld.tel+'|'+(ld.email||'')+'|'+(ld.ideia||'');
        if(ldKey!==leadSavedKey){
          leadSavedKey=ldKey;
          Object.assign(leadData,ld);
          saveLead(leadData);
        }
      }
    }
    if(data.campanha && data.campanha.id && !campanhaVinculada){
      campanhaVinculada=data.campanha;
      vincularCampanha(data.campanha.id);
    }
    if(data.studio_tel) studioTelAtual=data.studio_tel;
    if(data.agendamento){
      var tipoAgend=data.agendamento_tipo||'';
      if(typeof fbq==='function'){
        if(tipoAgend==='consulta') fbq('track','Contact',{origem:origemUtm});
        else fbq('track','Schedule',{origem:origemUtm});
      }
      if(typeof gtag==='function') gtag('event','conversion',{'send_to':'AW-18264070158/Gi3eCNrg9sMcEI6w_oRE'});
      fetch('https://inq-saas.vercel.app/api/registrar-evento',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({tipo_evento:tipoAgend==='consulta'?'Consulta':'Sessao',origem:origemUtm,cliente_id:savedLeadId||null})
      }).catch(function(){});
    }
  }

  // ── Lead / CRM ────────────────────────────────────────────────────────────
  function atualizarLead(){
    if(!leadData.nome || !leadData.tel) return;
    var ldKey=(leadData.nome||'')+'|'+(leadData.tel||'')+'|'+(leadData.email||'')+'|'+(leadData.ideia||'')+'|'+(leadData.regiao||'')+'|'+(leadData.orcamento||'')+'|'+(leadData.horario_ligacao||'');
    if(ldKey===leadSavedKey) return;
    leadSavedKey=ldKey;
    saveLead(leadData);
  }

  function saveLead(ld){
    fetch(C.leadUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        nome:ld.nome||'',
        tel:(ld.tel||'').replace(/\D/g,''),
        email:ld.email||'',
        idea:ld.ideia||'',
        artista:ld.artista||null,
        insta:ld.insta||'',
        regiao:ld.regiao||'',
        nascimento:ld.nascimento||'',
        referencias:pendingRefs,
        orig:origemUtm||'',
        obs:ld.obs||'',
        servico_interesse:ld.servico||'',
        orcamento:ld.orcamento||'',
        horario_ligacao:ld.horario_ligacao||'',
        chat_log:history.slice()
      })
    }).then(function(r){
      if(!r.ok){r.text().then(function(t){console.warn('[Aura] lead error:',t);});return;}
      return r.json();
    }).then(function(d){
      if(d && d.clienteId){
        savedLeadId=d.clienteId;
        if(typeof fbq==='function') fbq('track','Lead',{origem:origemUtm});
        fetch('https://inq-saas.vercel.app/api/registrar-evento',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({tipo_evento:'Lead',origem:origemUtm,cliente_id:savedLeadId})
        }).catch(function(){});
        if(campanhaVinculada && campanhaVinculada.id) vincularCampanha(campanhaVinculada.id);
      }
    }).catch(function(e){console.warn('[Aura] lead fetch error:',e);});
  }

  function vincularCampanha(campanhaId){
    if(!savedLeadId) return;
    fetch('https://inq-ink-system.vercel.app/api/vincular-campanha',{

  // ── Send handler ──────────────────────────────────────────────────────────
  function send(){
    if(inp.disabled) return;
    if(fluxoEnviarOverride){ fluxoEnviarOverride(); return; }
    var v=inp.value.trim(); if(!v) return;
    inp.value='';inp.style.height='auto';
    usr(v);
    // Passo 0: parseia nome+tel localmente, sem chamar API
    if(fluxoEtapa===0){
      var parsed=parsePasso0(v);
      if(parsed.nome && parsed.tel){
        leadData.nome=parsed.nome;
        leadData.tel=parsed.tel;
        history.push({role:'user',content:v});
        saveLead(leadData);

          emailTimerFired=true;
          if(leadData.email) sendEmails(leadData);
        }, 120000);
        setTimeout(passo2, 300);
      } else {
        // não conseguiu extrair — pede de novo
        botAnimado('Não consegui identificar o WhatsApp. Pode me passar assim: "Nome Sobrenome, 27 99999-0000"?', function(){ dis(false); });
        dis(true);
      }
      return;
    }
    askAura(v);
  }

  // ── Imagem ────────────────────────────────────────────────────────────────
  function compressImg(file,maxPx,quality){
    return new Promise(function(resolve){
      var reader=new FileReader();
      reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
          var w=img.width,h=img.height;
          if(w>maxPx||h>maxPx){
            if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
            else{w=Math.round(w*maxPx/h);h=maxPx;}
          }
          var canvas=document.createElement('canvas');
          canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          var dataUrl=canvas.toDataURL('image/jpeg',quality);
          resolve({dataUrl:dataUrl,base64:dataUrl.split(',')[1],mimeType:'image/jpeg'});
        };
        img.src=e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function removePendingPreview(){
    var prev=document.getElementById('pending-img-preview');
    if(prev) prev.remove();
  }

  document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharLb();});

  phBtn.onclick=function(){ phInp.click(); };
  phInp.addEventListener('change',function(){
    var file=phInp.files[0];
    if(!file) return;
    phInp.value='';
    if(!file.type.startsWith('image/')){
      renderBot('Só consigo receber imagens. Pode tentar novamente?');
      return;
    }
    // Passos 3A/3B: upload controlado — guarda em memória, exibe preview
    if(fluxoEtapa==='3a'||fluxoEtapa==='3b'){
      (async function(){
        var compressed=await compressImg(file,800,0.75);
        pendingFile=file;
        removePendingPreview();
        var prev=document.createElement('div');
        prev.id='pending-img-preview';
        prev.style.cssText='align-self:flex-end;margin-bottom:2px;';
        var img=document.createElement('img');
        img.src=compressed.dataUrl;
        img.style.cssText='max-width:120px;max-height:120px;border-radius:8px;display:block;border:1px solid rgba(201,168,76,.3);';
        var lbl=document.createElement('div');
        lbl.textContent='📎 Aguardando envio...';
        lbl.style.cssText='font-size:10px;color:#666;margin-top:3px;text-align:right;';
        prev.appendChild(img); prev.appendChild(lbl);
        msgs.appendChild(prev); scr();
      })();
      return;
    }
    // Etapa livre (99): comportamento original — envia imediatamente
    (async function(){
      var compressed=await compressImg(file,800,0.75);
      var el=document.createElement('div');
      el.className='am u';
      var img=document.createElement('img');
      img.src=compressed.dataUrl;
      img.style.cssText='max-width:180px;max-height:180px;border-radius:8px;display:block;margin-top:4px';
      el.appendChild(img);
      msgs.appendChild(el);scr();
      try{
        var r=await fetch(C.uploadUrl,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({base64:compressed.base64,mimeType:'image/jpeg',clienteId:savedLeadId||null})
        });
        var d=await r.json();
        if(d.url){
          pendingRefs.push(d.url);
          history.push({role:'user',content:'[O cliente enviou uma imagem de referência]'});
          await askAura(null);
        } else {
          renderBot('Recebi a imagem, mas tive um problema ao salvá-la. Pode tentar novamente?');
        }
      }catch(err){
        console.warn('[Aura] upload error:',err);
        renderBot('Tive uma instabilidade ao receber a imagem. Pode tentar novamente?');
      }
    })();
  });
})();
